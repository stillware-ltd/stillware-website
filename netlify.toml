[build]
  command = "npm run build"
  publish = "dist"

[context.production]
  environment = { NODE_VERSION = "20" }

# After each production deploy, tell IndexNow (Bing and others) which pages changed.
# Local plugin: netlify/plugins/indexnow. It cannot fail a deploy: its hooks catch their own errors.
[[plugins]]
  package = "./netlify/plugins/indexnow"

# License API — proxy clean URLs to Netlify Functions.
# Call these on https://www.stillwareltd.com only. The apex (stillwareltd.com) is a domain alias
# that Netlify redirects to the primary domain BEFORE any rule here runs (308 for a POST), and
# neither Dart's HttpClient nor Paddle follows a redirect for a POST. No rule in this file can
# serve them on the apex: desktop builds that call the apex, and a Paddle webhook destination on
# the apex, fail until they use www. Kept above the host rules so nothing below can shadow them.
[[redirects]]
  from = "/webhooks/paddle"
  to = "/.netlify/functions/paddle-webhook"
  status = 200

[[redirects]]
  from = "/api/licenses/activate"
  to = "/.netlify/functions/license-activate"
  status = 200

[[redirects]]
  from = "/api/licenses/deactivate"
  to = "/.netlify/functions/license-deactivate"
  status = 200

[[redirects]]
  from = "/api/licenses/validate"
  to = "/.netlify/functions/license-validate"
  status = 200

[[redirects]]
  from = "/api/licenses/resend-key"
  to = "/.netlify/functions/license-resend-key"
  status = 200

[[redirects]]
  from = "/api/licenses/trial/start"
  to = "/.netlify/functions/trial-start"
  status = 200

[[redirects]]
  from = "/api/licenses/trial/status"
  to = "/.netlify/functions/trial-status"
  status = 200

[[redirects]]
  from = "/api/dashboard/ops"
  to = "/.netlify/functions/dashboard-ops"
  status = 200

# Household licence ("Every device", KL.2): the app's sign-in and the RevenueCat webhook. Same www-only
# rule as above. Each /api/household/* function except prices answers 404 {"error":"off"} until
# HOUSEHOLD_ENABLED is "1" (prices reads public prices only and is always on);
# docs/household-licence-server.md says how to switch them off again and what stays valid.
[[redirects]]
  from = "/api/household/fetch"
  to = "/.netlify/functions/household-fetch"
  status = 200

[[redirects]]
  from = "/api/household/signin/start"
  to = "/.netlify/functions/household-signin-start"
  status = 200

[[redirects]]
  from = "/api/household/signin/verify"
  to = "/.netlify/functions/household-signin-verify"
  status = 200

[[redirects]]
  from = "/api/household/link/start"
  to = "/.netlify/functions/household-link-start"
  status = 200

[[redirects]]
  from = "/api/household/link/verify"
  to = "/.netlify/functions/household-link-verify"
  status = 200

[[redirects]]
  from = "/api/household/email/remove/start"
  to = "/.netlify/functions/household-email-remove-start"
  status = 200

[[redirects]]
  from = "/api/household/email/remove/verify"
  to = "/.netlify/functions/household-email-remove-verify"
  status = 200

[[redirects]]
  from = "/api/household/prices"
  to = "/.netlify/functions/household-prices"
  status = 200

[[redirects]]
  from = "/webhooks/revenuecat"
  to = "/.netlify/functions/revenuecat-webhook"
  status = 200

# Canonical host is https://www.stillwareltd.com. Send every other variant there in ONE hop
# (http apex used to take two: http -> https apex -> https www). force = true so these win over any file.
[[redirects]]
  from = "http://stillwareltd.com/*"
  to = "https://www.stillwareltd.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.stillwareltd.com/*"
  to = "https://www.stillwareltd.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://stillwareltd.com/*"
  to = "https://www.stillwareltd.com/:splat"
  status = 301
  force = true

# Retired pages (the services line, removed blog posts) return 410 Gone; see public/_redirects.

# Conventional sitemap path -> the Astro sitemap index (GSC/crawlers probe /sitemap.xml; it 404'd until 2026-09-07)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Legacy /zeroed/* pages now live at /privacy/, /terms/, /support/ and /delete-account/ (one hop, straight to the slash URL).
# force = true: the old static copies used to sit in public/zeroed/ and shadowed these rules, so the
# duplicates answered 200. They are deleted, and force keeps the redirects winning if a file ever returns.
[[redirects]]
  from = "/zeroed/privacy"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/zeroed/privacy.html"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/zeroed/terms"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/zeroed/terms.html"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/zeroed/support"
  to = "/support/"
  status = 301
  force = true

[[redirects]]
  from = "/zeroed/delete-account"
  to = "/delete-account/"
  status = 301
  force = true

[[redirects]]
  from = "/zeroed/delete-account.html"
  to = "/delete-account/"
  status = 301
  force = true

# Form notifications — sends all form submissions to support email
# Configure in Netlify Dashboard: Site settings > Forms > Form notifications
# Add "Email notification" for each form, recipient: support@stillwareltd.com
# Forms: newsletter, notify-estate-keep, notify-fort-knox,
#         notify-estate-keep-apps, notify-fort-knox-apps

# Security headers on every response (these were <meta http-equiv> tags in Layout.astro, which browsers ignore)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets. Astro writes hashed CSS/JS to /_astro/ (not /assets/), so the file name changes
# whenever the content does and a year-long immutable cache is safe.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/blog/images/**/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=2592000"

# Dashboard moved under /dashboard/zeroed (2026-09-05)
[[redirects]]
  from = "/dashboard"
  to = "/dashboard/zeroed/"
  status = 301
[[redirects]]
  from = "/dashboard/"
  to = "/dashboard/zeroed/"
  status = 301

# The IndexNow plugin publishes a page-hash manifest with every deploy and reads the previous one back.
# It is plumbing, not content: always fetch it fresh and keep it out of search.
[[headers]]
  for = "/indexnow-manifest.json"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# Private marketing dashboard (encrypted client-side; keep out of search)
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
