  <text x="316" y="204" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">Greenlight Core</text>
  <rect x="334" y="174" width="548" height="44" rx="8" fill="#dc2626" opacity="0.85"/>
  <text x="894" y="204" font-size="15" font-weight="700" fill="#dc2626">$359.40</text>
  <text x="316" y="266" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">Homey (yearly plan)</text>
  <rect x="334" y="236" width="458" height="44" rx="8" fill="#f59e0b" opacity="0.85"/>
  <text x="804" y="266" font-size="15" font-weight="700" fill="#f59e0b">$299.95</text>
  <text x="316" y="328" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">BusyKid ($4/mo, billed yearly)</text>
  <rect x="334" y="298" width="366" height="44" rx="8" fill="#f59e0b" opacity="0.85"/>
  <text x="712" y="328" font-size="15" font-weight="700" fill="#f59e0b">$240</text>
  <text x="316" y="390" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">iAllowance (iPhone, iPad, Mac)</text>
  <rect x="334" y="360" width="5" height="44" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="351" y="390" font-size="15" font-weight="700" fill="#16a34a">$2.99</text>
  <text x="316" y="452" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">SimplChores (iPhone, iPad)</text>
  <rect x="334" y="422" width="5" height="44" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="351" y="452" font-size="15" font-weight="700" fill="#16a34a">$1.99</text>
  <text x="316" y="514" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">OurHome (free, optional in-app buys)</text>
