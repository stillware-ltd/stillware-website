<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" width="1200" height="686" role="img" aria-label="Five-year cost of chore tracking apps: Homey monthly $419.40, Greenlight Core $359.40, Homey yearly $299.95, BusyKid $240, iAllowance $2.99, SimplChores $1.99, OurHome free, paper chart a few dollars">
  <style>
    text { font-family: Inter, system-ui, -apple-system, sans-serif; }
  </style>
  <rect width="1200" height="686" fill="#ffffff"/>
  <rect width="1200" height="6" fill="#2563eb"/><rect y="6" width="1200" height="2" fill="#60a5fa" opacity="0.4"/>
  <text x="600" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Five-Year Cost of Chore Tracking Apps</text>
  <text x="600" y="84" text-anchor="middle" font-size="14" fill="#64748b">US dollars. Prices checked 7 October 2026 on each app's own site or store listing.</text>
  <line x1="330" y1="104" x2="330" y2="616" stroke="#e2e8f0" stroke-width="1"/>
  <text x="316" y="142" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">Homey (monthly plan)</text>
  <rect x="334" y="112" width="640" height="44" rx="8" fill="#dc2626" opacity="0.85"/>
