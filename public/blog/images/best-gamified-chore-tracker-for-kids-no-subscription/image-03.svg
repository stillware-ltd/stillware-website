  <text x="351" y="514" font-size="15" font-weight="700" fill="#2563eb">$0</text>
  <text x="316" y="576" text-anchor="end" font-size="14" font-weight="500" fill="#1e293b">Paper chart</text>
  <rect x="334" y="546" width="5" height="44" rx="8" fill="#2563eb" opacity="0.85"/>
  <text x="351" y="576" font-size="15" font-weight="700" fill="#2563eb">A few dollars once</text>
  <text x="40" y="660" font-size="12" fill="#64748b">BusyKid and Greenlight also move real money (Visa card), so they are not like-for-like with a checklist app.</text>
  <text x="1190" y="678" text-anchor="end" font-size="10" fill="#94a3b8">stillwareltd.com</text>
