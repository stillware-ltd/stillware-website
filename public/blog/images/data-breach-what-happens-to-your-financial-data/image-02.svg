<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="What a breach can cost you in the US">
  <style>
    text { font-family: Inter, system-ui, -apple-system, sans-serif; }
  </style>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect width="1200" height="4" fill="#0f766e"/>
  <text x="600" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">What a breach can cost you in the US</text>
  <rect x="60" y="92" width="1080" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="60" y="92" width="6" height="92" rx="3" fill="#0f766e"/>
  <text x="90" y="130" font-size="18" font-weight="700" fill="#1e293b">Credit card fraud</text>
  <text x="90" y="160" font-size="15" fill="#64748b">Your liability cap; $0 if only the card number was stolen</text>
  <text x="1115" y="146" text-anchor="end" font-size="22" font-weight="800" fill="#0f766e">$50 max</text>
  <rect x="60" y="192" width="1080" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="60" y="192" width="6" height="92" rx="3" fill="#0f766e"/>
  <text x="90" y="230" font-size="18" font-weight="700" fill="#1e293b">Debit card fraud</text>
  <text x="90" y="260" font-size="15" fill="#64748b">$50 if reported within 2 business days; can be unlimited after 60 days</text>
  <text x="1115" y="246" text-anchor="end" font-size="22" font-weight="800" fill="#0f766e">$50 to $500</text>
  <rect x="60" y="292" width="1080" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="60" y="292" width="6" height="92" rx="3" fill="#0f766e"/>
  <text x="90" y="330" font-size="18" font-weight="700" fill="#1e293b">Credit freeze at all three bureaus</text>
  <text x="90" y="360" font-size="15" fill="#64748b">Free by law since 21 September 2018; lifted within an hour online</text>
  <text x="1115" y="346" text-anchor="end" font-size="22" font-weight="800" fill="#0f766e">Free</text>
  <rect x="60" y="392" width="1080" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="60" y="392" width="6" height="92" rx="3" fill="#0f766e"/>
  <text x="90" y="430" font-size="18" font-weight="700" fill="#1e293b">New account opened in your name</text>
  <text x="90" y="460" font-size="15" fill="#64748b">Average direct loss for these victims, against $880 for all (BJS, 2021 data)</text>
  <text x="1115" y="446" text-anchor="end" font-size="22" font-weight="800" fill="#0f766e">$3,430</text>
  <rect x="60" y="492" width="1080" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="60" y="492" width="6" height="92" rx="3" fill="#0f766e"/>
  <text x="90" y="530" font-size="18" font-weight="700" fill="#1e293b">IRS identity-theft case</text>
  <text x="90" y="560" font-size="15" fill="#64748b">Typical time to resolve (National Taxpayer Advocate, June 2026)</text>
  <text x="1115" y="546" text-anchor="end" font-size="22" font-weight="800" fill="#0f766e">~20 months</text>
  <text x="600" y="614" text-anchor="middle" font-size="13" fill="#64748b">Sources: FTC and CFPB (card liability, Regulation E), FTC (credit freezes), Bureau of Justice Statistics,</text>
  <text x="600" y="634" text-anchor="middle" font-size="13" fill="#64748b">Victims of Identity Theft 2021, National Taxpayer Advocate. Checked 7 October 2026.</text>
  <text x="1180" y="664" text-anchor="end" font-size="12" fill="#94a3b8">stillwareltd.com</text>
</svg>
