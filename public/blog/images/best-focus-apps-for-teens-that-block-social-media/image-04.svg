<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <style>
    text { font-family: Inter, system-ui, -apple-system, sans-serif; }
  </style>

  <rect width="1200" height="675" fill="#faf5ff"/>

  <!-- Background pattern (per-article variation) -->
  <rect width="1200" height="675" fill="#f3e8ff" opacity="0.4"/>

  <!-- Subtle top accent bar -->
  <rect width="1200" height="4" fill="#f59e0b"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">The evolution of teen focus apps</text>

  
  
  
  

  <!-- Dot accent colors (theme-aware) -->
  

  <!-- Horizontal timeline line -->
  <line x1="95" y1="330" x2="1105" y2="330" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <!-- Colored overlay on the line -->
  <line x1="95" y1="330" x2="1105" y2="330" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  
  
  
  

  <!-- Dot -->
  <circle cx="110" cy="330" r="10" fill="#faf5ff" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="110" cy="330" r="4" fill="#f59e0b"/>

  <!-- Vertical connector -->
  
  <line x1="110" y1="320" x2="110" y2="280" stroke="#e2e8f0" stroke-width="1.5"/>
  

  <!-- Event card -->
  
  
  

